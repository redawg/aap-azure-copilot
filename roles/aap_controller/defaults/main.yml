---
aap_user: admin
aap_password: ""
aap_base_url: https://aap-aap.apps.cluster-wg2cd-2.dynamic2.redhatworkshops.io
foundry_validate_certs: false

aap_job_templates_page_size: 200
aap_recent_jobs_limit: 10
aap_job_template_search: ""
aap_launch_job_template_id: ""
aap_launch_job_template_name: ""

# Controller projects (API — use when MCP has no write tools, e.g. no projects_create)
aap_organization_id: 1
aap_projects_page_size: 200
aap_scm_branch: main
aap_scm_clean: true
aap_scm_update_on_launch: true
aap_sync_project_updates: true

# GitHub → AAP project sync (playbooks/sync-github-projects.yml)
aap_github_owner: redawg
aap_github_repo_limit: 100
# Explicit list; leave empty to discover public repos via `gh` CLI
aap_github_repos: []
# Optional: read projects via MCP tools/call projects_list (still creates via API)
aap_use_mcp_for_project_read: false

# Single project create (playbooks/aap-create-project.yml)
aap_project_name: ""
aap_project_scm_url: ""
aap_project_description: ""

# Job template: playbooks/azure-fedora-alerts.yml (playbooks/aap-create-azure-fedora-template.yml)
aap_azure_fedora_job_template_name: "Azure VM + Foundry Alerts"
aap_azure_fedora_job_template_description: >-
  Deploy Azure Linux VM, Function alert bridge, and Monitor metric rule
  (playbooks/azure-fedora-alerts.yml). Requires az login on the execution node.
aap_azure_fedora_project_name: aap-azure-copilot
aap_azure_fedora_project_id: 0
aap_azure_fedora_inventory_id: 3
aap_azure_fedora_playbook: playbooks/azure-fedora-alerts.yml
aap_azure_fedora_execution_environment_id: 0
aap_azure_fedora_ask_variables_on_launch: true
aap_azure_fedora_job_template_id: ""
aap_azure_fedora_job_extra_vars: ""
aap_azure_fedora_default_extra_vars: {}

# Job template: playbooks/azure-rhel-byol-server.yml
aap_azure_rhel_job_template_name: "Azure RG + RHEL BYOS Server"
aap_azure_rhel_job_template_description: >-
  Create Azure resource group and RHEL BYOS VM (azure.azcollection,
  license_type RHEL_BYOS). Playbook playbooks/azure-rhel-byol-server.yml.
aap_azure_rhel_project_name: aap-azure-copilot
aap_azure_rhel_project_id: 0
aap_azure_rhel_inventory_id: 3
aap_azure_rhel_playbook: playbooks/azure-rhel-byol-server.yml
aap_azure_rhel_execution_environment_id: 0
aap_azure_rhel_credential_id: 0
aap_azure_rhel_ask_variables_on_launch: true
aap_azure_rhel_job_template_id: ""
aap_azure_rhel_job_extra_vars: ""
aap_azure_rhel_byol_default_extra_vars: {}

# Job template: playbooks/cisco-snmp-compliance.yml
aap_cisco_snmp_job_template_name: "Cisco SNMP compliance check"
aap_cisco_snmp_job_template_description: >-
  Compare Cisco IOS SNMP settings to files/cisco_snmp_expected.cfg
  (playbooks/cisco-snmp-compliance.yml). Requires network inventory + credential.
aap_cisco_snmp_project_name: aap-azure-copilot
aap_cisco_snmp_project_id: 0
aap_cisco_snmp_inventory_id: 3
aap_cisco_snmp_playbook: playbooks/cisco-snmp-compliance.yml
aap_cisco_snmp_execution_environment_id: 0
aap_cisco_snmp_credential_id: 0
aap_cisco_snmp_ask_variables_on_launch: true
aap_cisco_snmp_ask_inventory_on_launch: true
aap_cisco_snmp_job_template_id: ""
